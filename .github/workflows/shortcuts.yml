name: Shortcuts

# Compiles the tracker shortcuts in shortcuts/*.cherri with the Cherri compiler,
# which signs them through RoutineHub's HubSign service (iOS only imports
# signed shortcuts), and publishes them on the "shortcuts" pre-release:
#   https://github.com/<owner>/<repo>/releases/download/shortcuts/<Name>.shortcut
# Open one of those links on the iPhone to add the shortcut.

on:
  push:
    branches: [main]
    paths:
      - "shortcuts/**"
      - ".github/workflows/shortcuts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Cherri
        run: |
          git clone -q https://github.com/electrikmilk/cherri "$RUNNER_TEMP/cherri"
          git -C "$RUNNER_TEMP/cherri" checkout -q bcc0095754e2cc0baaeb4d93dae172b8153b4716
          (cd "$RUNNER_TEMP/cherri" && go build -o cherri .)
          echo "$RUNNER_TEMP/cherri" >> "$GITHUB_PATH"

      - name: Compile and sign
        working-directory: shortcuts
        run: |
          # Cherri compiles each one unsigned; fix-app-intents.py repairs the
          # TimeTracker app actions (Cherri wraps their AppIntentDescriptor);
          # then RoutineHub's HubSign signs it, the same request Cherri makes.
          mkdir -p ../out
          for f in tt-*.cherri; do
            [ "$f" = "tt-actions.cherri" ] && continue
            cherri "$f" --skip-sign --derive-uuids --no-ansi
          done
          for f in *_unsigned.shortcut; do
            name="${f%_unsigned.shortcut}"
            python3 fix-app-intents.py "$f" "$RUNNER_TEMP/$name.xml"
            python3 -c 'import json,sys; print(json.dumps({"shortcutName": sys.argv[1], "shortcut": open(sys.argv[2]).read()}))' \
              "$name" "$RUNNER_TEMP/$name.xml" > "$RUNNER_TEMP/payload.json"
            out="../out/${name// /-}.shortcut"
            for try in 1 2 3; do
              code=$(curl -sS -o "$out" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                -A cherri/ci --data-binary @"$RUNNER_TEMP/payload.json" https://hubsign.routinehub.services/sign) || code=0
              [ "$code" = 200 ] && break
              echo "$name: HubSign answered $code, retrying"; sleep $((try * 10))
            done
            # Signed shortcuts are Apple Encrypted Archives, starting with "AEA1".
            [ "$(head -c 4 "$out")" = "AEA1" ] || { echo "$name is not signed"; exit 1; }
          done
          ls -la ../out

      - name: Publish to the "shortcuts" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shortcuts >/dev/null 2>&1 || \
            gh release create shortcuts --title "Shortcuts" --prerelease \
              --notes "Open a .shortcut link on the iPhone to add it to Shortcuts."
          gh release upload shortcuts out/*.shortcut --clobber
          # Only what this build made: drop assets of retired shortcuts.
          for a in $(gh release view shortcuts --json assets -q '.assets[].name'); do
            [ -e "out/$a" ] || gh release delete-asset shortcuts "$a" -y
          done
