name: Shortcuts

# Builds the test shortcuts defined in shortcuts/build.py, signs them with
# Apple's `shortcuts sign` on a macOS runner, and publishes them on the
# "shortcuts" pre-release so they install on the iPhone with one tap.

on:
  push:
    branches: [main]
    paths:
      - "shortcuts/build.py"
      - ".github/workflows/shortcuts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 shortcuts/build.py

      - name: Sign
        run: |
          sw_vers
          mkdir -p shortcuts/dist
          for f in shortcuts/build/*.shortcut; do
            out="shortcuts/dist/$(basename "$f")"
            shortcuts sign --mode anyone --input "$f" --output "$out"
            # Signed shortcuts are Apple Encrypted Archives, starting with "AEA1".
            echo "$(head -c 4 "$out")  $out  $(wc -c < "$out") bytes"
          done

      - name: Publish to the "shortcuts" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shortcuts >/dev/null 2>&1 || \
            gh release create shortcuts --title "Test shortcuts" --prerelease \
              --notes "Open a .shortcut link on the iPhone to add it to Shortcuts."
          gh release upload shortcuts shortcuts/dist/*.shortcut --clobber
