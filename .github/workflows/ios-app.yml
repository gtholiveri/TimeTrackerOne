name: iOS app

# Builds the TimeTracker app (with the TT Safari extension) unsigned, to
# sideload (docs/empirical-tests.md, section 4). Builds from main are published
# on the "ios-app" pre-release:
#   https://github.com/<owner>/<repo>/releases/download/ios-app/TimeTracker-unsigned.ipa

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "safari-extension/**"
      - "test-harness/ios-probe-app/**"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild build \
            -project TimeTracker.xcodeproj -scheme TimeTracker -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TimeTracker.app Payload/
          ls Payload/TimeTracker.app/PlugIns/TTSafari.appex
          test -f Payload/TimeTracker.app/PlugIns/TTSafari.appex/manifest.json
          test ! -e Payload/TimeTracker.app/PlugIns/TTSafari.appex/README.md
          zip -qry TimeTracker-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-unsigned-ipa
          path: ios/TimeTracker-unsigned.ipa

      - name: Publish to the "ios-app" release
        if: github.ref == 'refs/heads/main'
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-app >/dev/null 2>&1 || \
            gh release create ios-app --title "iOS app" --prerelease \
              --notes "Unsigned TimeTracker app with the TT Safari extension. Sideload it with Sideloadly."
          gh release upload ios-app TimeTracker-unsigned.ipa --clobber
