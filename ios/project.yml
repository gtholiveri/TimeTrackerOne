# XcodeGen spec for the probe app used by tests T10 and T12.
# CI generates TTProbe.xcodeproj from this (see .github/workflows/ios-probe.yml);
# on a Mac: `brew install xcodegen && xcodegen generate` in this folder.
name: TTProbe
options:
  bundleIdPrefix: com.gtholiveri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TTProbe:
    type: application
    platform: iOS
    sources:
      - path: TTProbe
      - path: ../test-harness/ios-probe-app/LockProbe.swift
    info:
      path: TTProbe/Info.plist
      properties:
        CFBundleDisplayName: TT Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.ttprobe
    dependencies:
      - target: TTProbeExtension

  TTProbeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TTProbeExtension
      # Copied flat into the extension bundle, where Safari looks for manifest.json.
      - path: ../test-harness/safari-probe
        buildPhase: resources
    info:
      path: TTProbeExtension/Info.plist
      properties:
        CFBundleDisplayName: TT Safari Probe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.ttprobe.extension

schemes:
  TTProbe:
    build:
      targets:
        TTProbe: all
        TTProbeExtension: all
