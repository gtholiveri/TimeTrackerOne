# XcodeGen spec for the TimeTracker app, which carries the TT Safari extension
# (safari-extension/) and the lock-probe Shortcuts action for test T12.
# CI generates TimeTracker.xcodeproj from this (.github/workflows/ios-app.yml);
# on a Mac: `brew install xcodegen && xcodegen generate` in this folder.
name: TimeTracker
options:
  bundleIdPrefix: com.gtholiveri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TimeTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../test-harness/ios-probe-app/LockProbe.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TimeTracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.timetracker
    dependencies:
      - target: TTSafari

  TTSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
      # Copied flat into the extension bundle, where Safari looks for manifest.json.
      - path: ../safari-extension
        buildPhase: resources
        excludes:
          - "*.md"
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: TT Safari
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.timetracker.safari

schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
        TTSafari: all
