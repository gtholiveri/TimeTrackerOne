# XcodeGen spec for the TimeTracker app, which carries the TT Safari extension
# (safari-extension/) and the lock-probe Shortcuts action for test T12.
# Signed builds for TestFlight run on a nomac cloud Mac (ios/README.md,
# ios/nomac-build.sh). CI still builds it unsigned (.github/workflows/ios-app.yml)
# as a compile check. On any Mac: `brew install xcodegen && xcodegen generate`.
name: TimeTracker
options:
  bundleIdPrefix: com.gtholiveri
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TimeTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../test-harness/ios-probe-app/LockProbe.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TimeTracker
        # XcodeGen writes 1.0 (1) unless told; TestFlight needs a new build number each upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No custom crypto (HTTPS only), so App Store Connect doesn't ask
        # the export-compliance question on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.timetracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TTSafari

  TTSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
      # Copied flat into the extension bundle, where Safari looks for manifest.json.
      - path: ../safari-extension
        buildPhase: resources
        excludes:
          - "*.md"
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: TT Safari
        # XcodeGen writes 1.0 (1) unless told; TestFlight needs a new build number each upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtholiveri.timetracker.safari

schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
        TTSafari: all
